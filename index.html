<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f8a4c">
  <title>NutriScan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🥗 NutriScan</h1>
    <p class="sub">Scanează un produs și vezi scorul nutrițional</p>
  </header>

  <main>
    <section id="scanner" class="card">
      <div id="video-wrap" hidden>
        <video id="video" playsinline muted></video>
        <div class="frame"></div>
      </div>
      <button id="scan-btn" class="primary">📷 Scanează codul de bare</button>
      <button id="stop-btn" class="secondary" hidden>Oprește camera</button>
      <form id="manual" autocomplete="off">
        <input id="code-input" inputmode="numeric" pattern="[0-9]{6,14}" placeholder="sau introdu codul (ex. 5449000000996)">
        <button type="submit" class="secondary">Caută</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="result" class="card" hidden></section>

    <section id="history-card" class="card" hidden>
      <div class="row-between">
        <h2>Istoric</h2>
        <button id="clear-history" class="link">Șterge</button>
      </div>
      <ul id="history"></ul>
    </section>
  </main>

  <footer>
    Date: <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (ODbL).
    Scorurile sunt informative și nu înlocuiesc sfatul unui specialist.
  </footer>

  <script src="vendor/zxing.min.js" defer></script>
  <script src="nutriscore.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
